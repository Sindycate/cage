services:
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        CAGE_VERSION: ${CAGE_VERSION:-dev}
    image: cage-base:latest
  claude:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CAGE_BASE: cage-base:latest
        CAGE_VERSION: ${CAGE_VERSION:-dev}
    image: claude-code:latest
    depends_on: [base]
  codex:
    build:
      context: .
      dockerfile: Dockerfile.codex
      args:
        CAGE_BASE: cage-base:latest
        CAGE_VERSION: ${CAGE_VERSION:-dev}
    image: codex:latest
    depends_on: [base]
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
      args:
        CAGE_BASE: cage-base:latest
        CAGE_VERSION: ${CAGE_VERSION:-dev}
    image: opencode:latest
    depends_on: [base]
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
      args:
        CAGE_BASE: cage-base:latest
        CAGE_VERSION: ${CAGE_VERSION:-dev}
    image: cage-token-monitor:latest
    depends_on: [base]
