name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        run: .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"

      - name: Scan complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path . \
            --log-opts="--all" \
            --redact=100 \
            --no-banner

  installer-macos-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify macOS system Bash installer path
        run: |
          /bin/bash --version | head -1
          python -m pytest -q tests/test_install_safety.py

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Docker integration smoke tests
        env:
          CAGE_RUN_DOCKER_SMOKE: '1'
        run: python -m pytest -q tests/test_docker_smoke.py

      - name: Build shared base, Desktop Codex, OpenCode, and Token Monitor smoke images
        run: |
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_VERSION=ci -t cage-base:ci -f Dockerfile.base .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t codex:desktop-smoke -f Dockerfile.codex .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t opencode:smoke -f Dockerfile.opencode .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t cage-token-monitor:smoke -f Dockerfile.monitor .
          docker run --rm --entrypoint opencode opencode:smoke --version
          CAGE_RUN_OPENCODE_DOCKER_CONTRACT=1 python3 -m pytest -q tests/test_opencode_proxy_contract.py
          CAGE_RUN_DOCKER_SMOKE=1 CAGE_MONITOR_SMOKE_IMAGE=cage-token-monitor:smoke python3 -m pytest -q tests/test_docker_smoke.py -k managed_host_monitor

      - name: Run Desktop SSH integration smoke test
        env:
          CAGE_RUN_DOCKER_SMOKE: '1'
          CAGE_DESKTOP_SMOKE_IMAGE: codex:desktop-smoke
        run: python -m pytest -q tests/test_docker_smoke.py -k desktop_remote

  test-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q cage-main.py cage-config.py cage_core cage-desktop.py cage-tui.py codex-remote.py cage-user-remap.py netgate-proxy.py mcp-bridge.py mcp-relay host-cmd-bridge.py host-cmd-relay scripts/build-release.py

      - name: Check shell syntax
        run: |
          bash -n cage cage-netgate.sh entrypoint.sh entrypoint-codex.sh entrypoint-opencode.sh install.sh .github/scripts/install-gitleaks.sh .github/scripts/candidate-attestation-status.sh .github/scripts/candidate-index-verify.sh
          node --check token-monitor-collector.js

      - name: Validate Compose configuration
        run: docker compose config

  # Publish immutable SHA-only candidate images after every CI gate passes on a
  # push to main. The final candidate tag is write-once and never referenced by
  # Cage's pull logic; each architecture is built on its matching native runner,
  # pushed only by digest, and assembled into the candidate tag afterward. No
  # QEMU or cross-version BuildKit cache is used.
  candidate-base-plan:
    needs: [secret-scan, installer-macos-bash32, test-python, test-docker, test-static]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: candidate-base-plan-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      base_exists: ${{ steps.resolve.outputs.base_exists }}
      base_digest: ${{ steps.resolve.outputs.base_digest }}
      needs_build: ${{ steps.resolve.outputs.needs_build }}
      recovery_requested: ${{ steps.resolve.outputs.recovery_requested }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version and commit
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep '^CAGE_VERSION=' cage | cut -d'"' -f2)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve final base candidate (verify and reuse) or authorize a build
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          . .github/scripts/candidate-attestation-status.sh

          verify_exact_platforms() {
            local ref="$1"
            local label="$2"
            local platforms actual
            platforms="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            actual="$(printf '%s' "$platforms" | tr ' ' '\n' | sed '/^$/d' | awk '$0 != "unknown/unknown"' | LC_ALL=C sort -u)"
            if [ "$actual" != $'linux/amd64\nlinux/arm64' ]; then
              echo "ERROR: ${label} must contain exactly linux/amd64 and linux/arm64 (${platforms})" >&2
              return 1
            fi
          }

          repo_path="sindycate/cage/base"
          ref="ghcr.io/sindycate/cage/base:candidate-${SHA}"
          status="$(ghcr_status "$repo_path" "candidate-${SHA}")"
          case "$status" in
            200)
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: invalid digest for existing base candidate: ${digest}" >&2; exit 1
              fi
              verify_exact_platforms "$ref" "existing base candidate"
              if gh attestation verify "oci://ghcr.io/sindycate/cage/base@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
                --source-digest "${SHA}" \
                --source-ref refs/heads/main; then
                echo "Reusing verified existing base candidate@${digest}"
                echo "recovery_requested=false" >> "$GITHUB_OUTPUT"
              else
                attestation_state="$(candidate_attestation_state "$digest")"
                if [ "$attestation_state" != "absent" ]; then
                  echo "ERROR: existing base candidate has an attestation that failed the exact policy; refusing recovery." >&2
                  exit 1
                fi
                echo "Existing base candidate has no attestation; artifact-backed recovery is authorized."
                echo "recovery_requested=true" >> "$GITHUB_OUTPUT"
              fi
              echo "base_exists=true" >> "$GITHUB_OUTPUT"
              echo "base_digest=${digest}" >> "$GITHUB_OUTPUT"
              echo "needs_build=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "No existing base candidate; native architecture builds are authorized."
              echo "base_exists=false" >> "$GITHUB_OUTPUT"
              echo "base_digest=" >> "$GITHUB_OUTPUT"
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
              echo "recovery_requested=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: ambiguous registry status (${status}) for ${ref}; refusing to build to protect the write-once candidate tag." >&2
              exit 1
              ;;
          esac

  candidate-base-arch:
    needs: [candidate-base-plan]
    if: needs.candidate-base-plan.result == 'success' && needs.candidate-base-plan.outputs.needs_build == 'true'
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: candidate-base-arch-${{ matrix.arch }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base architecture by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.base
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/sindycate/cage/base,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CAGE_VERSION=${{ needs.candidate-base-plan.outputs.version }}

      - name: Export base architecture digest metadata
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid base architecture digest: ${DIGEST}" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cage-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/cage-digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-base-digest-${{ needs.candidate-base-plan.outputs.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/cage-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

  candidate-base:
    needs: [candidate-base-plan, candidate-base-arch]
    if: >-
      always() &&
      needs.candidate-base-plan.result == 'success' &&
      (needs.candidate-base-arch.result == 'success' || needs.candidate-base-arch.result == 'skipped')
    runs-on: ubuntu-24.04
    concurrency:
      group: candidate-base-assemble-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.final.outputs.digest }}
      version: ${{ needs.candidate-base-plan.outputs.version }}
      sha: ${{ needs.candidate-base-plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download base architecture digest metadata
        if: >-
          needs.candidate-base-plan.outputs.needs_build == 'true' ||
          needs.candidate-base-plan.outputs.recovery_requested == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-base-digest-${{ needs.candidate-base-plan.outputs.sha }}-*
          path: ${{ runner.temp }}/cage-digests
          merge-multiple: true

      - name: Assemble or verify final base candidate
        id: final
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_NEEDS_BUILD: ${{ needs.candidate-base-plan.outputs.needs_build }}
          PLAN_DIGEST: ${{ needs.candidate-base-plan.outputs.base_digest }}
          PLAN_RECOVERY_REQUESTED: ${{ needs.candidate-base-plan.outputs.recovery_requested }}
          SHA: ${{ needs.candidate-base-plan.outputs.sha }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          . .github/scripts/candidate-attestation-status.sh
          . .github/scripts/candidate-index-verify.sh

          verify_exact_platforms() {
            local ref="$1"
            local label="$2"
            local platforms actual
            platforms="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            actual="$(printf '%s' "$platforms" | tr ' ' '\n' | sed '/^$/d' | awk '$0 != "unknown/unknown"' | LC_ALL=C sort -u)"
            if [ "$actual" != $'linux/amd64\nlinux/arm64' ]; then
              echo "ERROR: ${label} must contain exactly linux/amd64 and linux/arm64 (${platforms})" >&2
              exit 1
            fi
          }

          read_arch_digest() {
            local path="$1"
            if [ ! -f "$path" ] || [ -L "$path" ]; then
              echo "ERROR: missing or unsafe architecture digest artifact ${path}" >&2
              exit 1
            fi
            local digest
            digest="$(tr -d '\r\n' < "$path")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: invalid architecture digest in ${path}: ${digest}" >&2
              exit 1
            fi
            printf '%s' "$digest"
          }

          load_arch_digests() {
            local digest_dir="$RUNNER_TEMP/cage-digests"
            if [ ! -d "$digest_dir" ]; then
              echo "ERROR: base architecture digest artifact directory is missing" >&2
              exit 1
            fi
            for entry in "$digest_dir"/*; do
              [ -e "$entry" ] || continue
              [ ! -L "$entry" ] || { echo "ERROR: unsafe base digest artifact ${entry}" >&2; exit 1; }
              [ -f "$entry" ] || { echo "ERROR: non-file base digest artifact ${entry}" >&2; exit 1; }
              case "$(basename "$entry")" in
                amd64|arm64) ;;
                *) echo "ERROR: unexpected base architecture artifact ${entry}" >&2; exit 1 ;;
              esac
            done
            AMD64_DIGEST="$(read_arch_digest "$digest_dir/amd64")"
            ARM64_DIGEST="$(read_arch_digest "$digest_dir/arm64")"
          }

          IMAGE="ghcr.io/sindycate/cage/base"
          REF="${IMAGE}:candidate-${SHA}"
          status="$(ghcr_status "sindycate/cage/base" "candidate-${SHA}")"
          case "$status" in
            200)
              digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: invalid existing base candidate digest: ${digest}" >&2; exit 1
              fi
              if [ -n "$PLAN_DIGEST" ] && [ "$digest" != "$PLAN_DIGEST" ]; then
                echo "ERROR: base candidate changed between plan and assembly (${PLAN_DIGEST} -> ${digest})" >&2
                exit 1
              fi
              verify_exact_platforms "${IMAGE}@${digest}" "base candidate"
              if gh attestation verify "oci://${IMAGE}@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
                --source-digest "$SHA" \
                --source-ref refs/heads/main; then
                echo "needs_attestation=false" >> "$GITHUB_OUTPUT"
              else
                attestation_state="$(candidate_attestation_state "$digest")"
                if [ "$attestation_state" != "absent" ]; then
                  echo "ERROR: existing base candidate has an attestation that failed the exact policy; refusing recovery." >&2
                  exit 1
                fi
                if [ "${PLAN_NEEDS_BUILD:-false}" != "true" ] && [ "${PLAN_RECOVERY_REQUESTED:-false}" != "true" ]; then
                  echo "ERROR: existing unattested base candidate was not authorized by the original build plan; refusing recovery." >&2
                  exit 1
                fi
                load_arch_digests
                verify_index_matches_arch_digests "${IMAGE}@${digest}" "base candidate" "$AMD64_DIGEST" "$ARM64_DIGEST"
                echo "Reattesting unchanged existing base candidate@${digest} after exact architecture comparison"
                echo "needs_attestation=true" >> "$GITHUB_OUTPUT"
              fi
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              if [ "$PLAN_NEEDS_BUILD" != "true" ]; then
                echo "ERROR: base candidate disappeared after a verified existing result; refusing to recreate it." >&2
                exit 1
              fi
              load_arch_digests
              verify_architecture_indexes "$IMAGE" "base candidate source" "$AMD64_DIGEST" "$ARM64_DIGEST"
              docker buildx imagetools create \
                --tag "$REF" \
                "${IMAGE}@${AMD64_DIGEST}" \
                "${IMAGE}@${ARM64_DIGEST}"
              status="$(ghcr_status "sindycate/cage/base" "candidate-${SHA}")"
              [ "$status" = "200" ] || { echo "ERROR: assembled base candidate was not readable after creation (status: ${status})" >&2; exit 1; }
              digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: invalid assembled base candidate digest: ${digest}" >&2; exit 1
              fi
              verify_exact_platforms "${IMAGE}@${digest}" "assembled base candidate"
              verify_index_matches_arch_digests "${IMAGE}@${digest}" "assembled base candidate" "$AMD64_DIGEST" "$ARM64_DIGEST"
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              echo "needs_attestation=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: ambiguous registry status (${status}) for ${REF}; refusing to assemble a write-once candidate tag." >&2
              exit 1
              ;;
          esac

      - name: Attest final assembled base index
        if: steps.final.outputs.needs_attestation == 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/base
          subject-digest: ${{ steps.final.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  candidate-leaf-plan:
    needs: [candidate-base]
    if: needs.candidate-base.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: candidate-leaf-plan-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
      claude_build: ${{ steps.plan.outputs.claude_build }}
      claude_digest: ${{ steps.plan.outputs.claude_digest }}
      claude_recovery_requested: ${{ steps.plan.outputs.claude_recovery_requested }}
      codex_build: ${{ steps.plan.outputs.codex_build }}
      codex_digest: ${{ steps.plan.outputs.codex_digest }}
      codex_recovery_requested: ${{ steps.plan.outputs.codex_recovery_requested }}
      opencode_build: ${{ steps.plan.outputs.opencode_build }}
      opencode_digest: ${{ steps.plan.outputs.opencode_digest }}
      opencode_recovery_requested: ${{ steps.plan.outputs.opencode_recovery_requested }}
      monitor_build: ${{ steps.plan.outputs.monitor_build }}
      monitor_digest: ${{ steps.plan.outputs.monitor_digest }}
      monitor_recovery_requested: ${{ steps.plan.outputs.monitor_recovery_requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve final leaf candidates (verify and reuse) or authorize builds
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.candidate-base.outputs.sha }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          . .github/scripts/candidate-attestation-status.sh

          verify_exact_platforms() {
            local ref="$1"
            local label="$2"
            local platforms actual
            platforms="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            actual="$(printf '%s' "$platforms" | tr ' ' '\n' | sed '/^$/d' | awk '$0 != "unknown/unknown"' | LC_ALL=C sort -u)"
            if [ "$actual" != $'linux/amd64\nlinux/arm64' ]; then
              echo "ERROR: ${label} must contain exactly linux/amd64 and linux/arm64 (${platforms})" >&2
              return 1
            fi
          }

          missing_images=""
          for image_key in \
            "claude:claude-code" \
            "codex:codex" \
            "opencode:opencode" \
            "monitor:token-monitor"; do
            key="${image_key%%:*}"
            image="${image_key#*:}"
            repo_path="sindycate/cage/${image}"
            ref="ghcr.io/sindycate/cage/${image}:candidate-${SHA}"
            status="$(ghcr_status "$repo_path" "candidate-${SHA}")"
            case "$status" in
              200)
                digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
                if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "ERROR: invalid digest for existing ${image} candidate: ${digest}" >&2; exit 1
                fi
                verify_exact_platforms "$ref" "existing ${image} candidate"
                if gh attestation verify "oci://ghcr.io/sindycate/cage/${image}@${digest}" \
                  --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
                  --source-digest "$SHA" \
                  --source-ref refs/heads/main; then
                  echo "Reusing verified existing ${image} candidate@${digest}"
                  echo "${key}_recovery_requested=false" >> "$GITHUB_OUTPUT"
                else
                  attestation_state="$(candidate_attestation_state "$digest")"
                  if [ "$attestation_state" != "absent" ]; then
                    echo "ERROR: existing ${image} candidate has an attestation that failed the exact policy; refusing recovery." >&2
                    exit 1
                  fi
                  echo "Existing ${image} candidate has no attestation; artifact-backed recovery is authorized."
                  echo "${key}_recovery_requested=true" >> "$GITHUB_OUTPUT"
                fi
                echo "${key}_build=false" >> "$GITHUB_OUTPUT"
                echo "${key}_digest=${digest}" >> "$GITHUB_OUTPUT"
                ;;
              404)
                echo "No existing ${image} candidate; native architecture builds are authorized."
                echo "${key}_build=true" >> "$GITHUB_OUTPUT"
                echo "${key}_digest=" >> "$GITHUB_OUTPUT"
                echo "${key}_recovery_requested=false" >> "$GITHUB_OUTPUT"
                missing_images="${missing_images}${missing_images:+ }${image}"
                ;;
              *)
                echo "ERROR: ambiguous registry status (${status}) for ${ref}; refusing to build to protect the write-once candidate tag." >&2
                exit 1
                ;;
            esac
          done

          if [ -n "$missing_images" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

          MISSING_IMAGES="$missing_images" python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          entries = []
          dockerfiles = {
              "claude-code": "Dockerfile",
              "codex": "Dockerfile.codex",
              "opencode": "Dockerfile.opencode",
              "token-monitor": "Dockerfile.monitor",
          }
          for image in os.environ.get("MISSING_IMAGES", "").split():
              for arch, platform, runner in (
                  ("amd64", "linux/amd64", "ubuntu-24.04"),
                  ("arm64", "linux/arm64", "ubuntu-24.04-arm"),
              ):
                  entries.append(
                      {
                          "key": image.split("-", 1)[0] if image != "token-monitor" else "monitor",
                          "image": image,
                          "dockerfile": dockerfiles[image],
                          "arch": arch,
                          "platform": platform,
                          "runner": runner,
                      }
                  )
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              output.write("build_matrix=" + json.dumps({"include": entries}, separators=(",", ":")) + "\n")
          PY

  candidate-leaf-arch:
    needs: [candidate-base, candidate-leaf-plan]
    if: needs.candidate-base.result == 'success' && needs.candidate-leaf-plan.result == 'success' && needs.candidate-leaf-plan.outputs.needs_build == 'true'
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: candidate-leaf-arch-${{ matrix.image }}-${{ matrix.arch }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-leaf-plan.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push leaf architecture by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/sindycate/cage/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CAGE_BASE=ghcr.io/sindycate/cage/base@${{ needs.candidate-base.outputs.digest }}
            CAGE_VERSION=${{ needs.candidate-base.outputs.version }}

      - name: Export leaf architecture digest metadata
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid ${{ matrix.image }} ${{ matrix.arch }} architecture digest: ${DIGEST}" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cage-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/cage-digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.image }}-digest-${{ needs.candidate-base.outputs.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/cage-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

  candidate-leaf-assemble:
    needs: [candidate-base, candidate-leaf-plan, candidate-leaf-arch]
    if: >-
      always() &&
      needs.candidate-base.result == 'success' &&
      needs.candidate-leaf-plan.result == 'success' &&
      (needs.candidate-leaf-arch.result == 'success' || needs.candidate-leaf-arch.result == 'skipped')
    runs-on: ubuntu-24.04
    concurrency:
      group: candidate-leaf-assemble-${{ matrix.image }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: claude
            image: claude-code
          - key: codex
            image: codex
          - key: opencode
            image: opencode
          - key: monitor
            image: token-monitor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download leaf architecture digest metadata
        if: >-
          needs.candidate-leaf-plan.outputs[format('{0}_build', matrix.key)] == 'true' ||
          needs.candidate-leaf-plan.outputs[format('{0}_recovery_requested', matrix.key)] == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-${{ matrix.image }}-digest-${{ needs.candidate-base.outputs.sha }}-*
          path: ${{ runner.temp }}/cage-digests
          merge-multiple: true

      - name: Assemble or verify final leaf candidate
        id: final
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/sindycate/cage/${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image }}
          PLAN_NEEDS_BUILD: ${{ needs.candidate-leaf-plan.outputs[format('{0}_build', matrix.key)] }}
          PLAN_DIGEST: ${{ needs.candidate-leaf-plan.outputs[format('{0}_digest', matrix.key)] }}
          PLAN_RECOVERY_REQUESTED: ${{ needs.candidate-leaf-plan.outputs[format('{0}_recovery_requested', matrix.key)] }}
          SHA: ${{ needs.candidate-base.outputs.sha }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          . .github/scripts/candidate-attestation-status.sh
          . .github/scripts/candidate-index-verify.sh

          verify_exact_platforms() {
            local ref="$1"
            local label="$2"
            local platforms actual
            platforms="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            actual="$(printf '%s' "$platforms" | tr ' ' '\n' | sed '/^$/d' | awk '$0 != "unknown/unknown"' | LC_ALL=C sort -u)"
            if [ "$actual" != $'linux/amd64\nlinux/arm64' ]; then
              echo "ERROR: ${label} must contain exactly linux/amd64 and linux/arm64 (${platforms})" >&2
              exit 1
            fi
          }

          read_arch_digest() {
            local path="$1"
            if [ ! -f "$path" ] || [ -L "$path" ]; then
              echo "ERROR: missing or unsafe architecture digest artifact ${path}" >&2
              exit 1
            fi
            local digest
            digest="$(tr -d '\r\n' < "$path")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: invalid architecture digest in ${path}: ${digest}" >&2
              exit 1
            fi
            printf '%s' "$digest"
          }

          load_arch_digests() {
            local digest_dir="$RUNNER_TEMP/cage-digests"
            if [ ! -d "$digest_dir" ]; then
              echo "ERROR: ${IMAGE_NAME} architecture digest artifact directory is missing" >&2
              exit 1
            fi
            for entry in "$digest_dir"/*; do
              [ -e "$entry" ] || continue
              [ ! -L "$entry" ] || { echo "ERROR: unsafe ${IMAGE_NAME} digest artifact ${entry}" >&2; exit 1; }
              [ -f "$entry" ] || { echo "ERROR: non-file ${IMAGE_NAME} digest artifact ${entry}" >&2; exit 1; }
              case "$(basename "$entry")" in
                amd64|arm64) ;;
                *) echo "ERROR: unexpected ${IMAGE_NAME} architecture artifact ${entry}" >&2; exit 1 ;;
              esac
            done
            AMD64_DIGEST="$(read_arch_digest "$digest_dir/amd64")"
            ARM64_DIGEST="$(read_arch_digest "$digest_dir/arm64")"
          }

          REF="${IMAGE}:candidate-${SHA}"
          status="$(ghcr_status "sindycate/cage/${IMAGE_NAME}" "candidate-${SHA}")"
          case "$status" in
            200)
              digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: invalid existing ${IMAGE_NAME} candidate digest: ${digest}" >&2; exit 1
              fi
              if [ -n "$PLAN_DIGEST" ] && [ "$digest" != "$PLAN_DIGEST" ]; then
                echo "ERROR: ${IMAGE_NAME} candidate changed between plan and assembly (${PLAN_DIGEST} -> ${digest})" >&2
                exit 1
              fi
              verify_exact_platforms "${IMAGE}@${digest}" "${IMAGE_NAME} candidate"
              if gh attestation verify "oci://${IMAGE}@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
                --source-digest "$SHA" \
                --source-ref refs/heads/main; then
                echo "needs_attestation=false" >> "$GITHUB_OUTPUT"
              else
                attestation_state="$(candidate_attestation_state "$digest")"
                if [ "$attestation_state" != "absent" ]; then
                  echo "ERROR: existing ${IMAGE_NAME} candidate has an attestation that failed the exact policy; refusing recovery." >&2
                  exit 1
                fi
                if [ "${PLAN_NEEDS_BUILD:-false}" != "true" ] && [ "${PLAN_RECOVERY_REQUESTED:-false}" != "true" ]; then
                  echo "ERROR: existing unattested ${IMAGE_NAME} candidate was not authorized by the original build plan; refusing recovery." >&2
                  exit 1
                fi
                load_arch_digests
                verify_index_matches_arch_digests "${IMAGE}@${digest}" "${IMAGE_NAME} candidate" "$AMD64_DIGEST" "$ARM64_DIGEST"
                echo "Reattesting unchanged existing ${IMAGE_NAME} candidate@${digest} after exact architecture comparison"
                echo "needs_attestation=true" >> "$GITHUB_OUTPUT"
              fi
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              if [ "$PLAN_NEEDS_BUILD" != "true" ]; then
                echo "ERROR: ${IMAGE_NAME} candidate disappeared after a verified existing result; refusing to recreate it." >&2
                exit 1
              fi
              load_arch_digests
              verify_architecture_indexes "$IMAGE" "${IMAGE_NAME} candidate source" "$AMD64_DIGEST" "$ARM64_DIGEST"
              docker buildx imagetools create \
                --tag "$REF" \
                "${IMAGE}@${AMD64_DIGEST}" \
                "${IMAGE}@${ARM64_DIGEST}"
              status="$(ghcr_status "sindycate/cage/${IMAGE_NAME}" "candidate-${SHA}")"
              [ "$status" = "200" ] || { echo "ERROR: assembled ${IMAGE_NAME} candidate was not readable after creation (status: ${status})" >&2; exit 1; }
              digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: invalid assembled ${IMAGE_NAME} candidate digest: ${digest}" >&2; exit 1
              fi
              verify_exact_platforms "${IMAGE}@${digest}" "assembled ${IMAGE_NAME} candidate"
              verify_index_matches_arch_digests "${IMAGE}@${digest}" "assembled ${IMAGE_NAME} candidate" "$AMD64_DIGEST" "$ARM64_DIGEST"
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              echo "needs_attestation=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: ambiguous registry status (${status}) for ${REF}; refusing to assemble a write-once candidate tag." >&2
              exit 1
              ;;
          esac

      - name: Attest final assembled leaf index
        if: steps.final.outputs.needs_attestation == 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/${{ matrix.image }}
          subject-digest: ${{ steps.final.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  candidate:
    needs: [candidate-base, candidate-leaf-assemble]
    if: >-
      always() &&
      needs.candidate-base.result == 'success' &&
      needs.candidate-leaf-assemble.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: candidate-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve candidate digests from GHCR and write candidate manifest
        env:
          BASE_DIGEST: ${{ needs.candidate-base.outputs.digest }}
          SHA: ${{ needs.candidate-base.outputs.sha }}
          VERSION: ${{ needs.candidate-base.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          if [[ ! "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid base candidate digest: ${BASE_DIGEST}" >&2; exit 1
          fi

          resolve_candidate() {
            local name="$1"
            local expected=""
            if [ "$#" -ge 2 ]; then
              expected="$2"
            fi
            local repo_path="sindycate/cage/${name}"
            local ref="ghcr.io/sindycate/cage/${name}:candidate-${SHA}"
            local status
            status="$(ghcr_status "$repo_path" "candidate-${SHA}")"
            if [ "$status" != "200" ]; then
              echo "ERROR: candidate ${name} is not present in GHCR (status: ${status})" >&2
              exit 1
            fi

            local digest
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: invalid digest for ${name}: ${digest}" >&2; exit 1
            fi
            if [ -n "$expected" ] && [ "$digest" != "$expected" ]; then
              echo "ERROR: candidate $name digest $digest != expected $expected" >&2; exit 1
            fi

            local platforms actual
            platforms="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            actual="$(printf '%s' "$platforms" | tr ' ' '\n' | sed '/^$/d' | awk '$0 != "unknown/unknown"' | LC_ALL=C sort -u)"
            if [ "$actual" != $'linux/amd64\nlinux/arm64' ]; then
              echo "ERROR: candidate ${name} must contain exactly linux/amd64 and linux/arm64 (${platforms})" >&2
              exit 1
            fi

            if ! gh attestation verify "oci://ghcr.io/sindycate/cage/${name}@${digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
              --source-digest "${SHA}" \
              --source-ref refs/heads/main >/dev/null; then
              echo "ERROR: candidate ${name} attestation verification failed" >&2
              return 1
            fi

            printf '%s' "$digest"
          }

          # Re-resolve the base candidate independently from GHCR and compare it
          # with candidate-base's output before using it in the manifest.
          BASE_DIGEST="$(resolve_candidate "base" "$BASE_DIGEST")"
          CLAUDE_DIGEST="$(resolve_candidate "claude-code")"
          CODEX_DIGEST="$(resolve_candidate "codex")"
          OPENCODE_DIGEST="$(resolve_candidate "opencode")"
          MONITOR_DIGEST="$(resolve_candidate "token-monitor")"

          python3 - "$SHA" "$VERSION" "$RUN_ID" "$BASE_DIGEST" \
            "$CLAUDE_DIGEST" "$CODEX_DIGEST" "$OPENCODE_DIGEST" "$MONITOR_DIGEST" <<'PY'
          import json, sys

          sha, version, run_id_str, base_digest, claude, codex, opencode, monitor = sys.argv[1:9]
          run_id = int(run_id_str)

          digests = {
              "base": base_digest.strip(),
              "claude-code": claude.strip(),
              "codex": codex.strip(),
              "opencode": opencode.strip(),
              "token-monitor": monitor.strip(),
          }

          manifest = {
              "schema": "cage.release-candidate",
              "schema_version": 3,
              "source_sha": sha,
              "version": version,
              "ci_run_id": run_id,
              "platforms": ["linux/amd64", "linux/arm64"],
              "images": {
                  name: {
                      "name": f"ghcr.io/sindycate/cage/{name}",
                      "tag": f"candidate-{sha}",
                      "digest": digests[name]
                  }
                  for name in ("base", "claude-code", "codex", "opencode", "token-monitor")
              }
          }

          manifest_path = f"release-candidate-{sha}.json"
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          # Verify parsing
          with open(manifest_path, encoding="utf-8") as f:
              json.load(f)
          print(f"Successfully assembled verified manifest {manifest_path}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.candidate-base.outputs.sha }}
          path: release-candidate-${{ needs.candidate-base.outputs.sha }}.json
          if-no-files-found: error
          retention-days: 30
