name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        run: .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"

      - name: Scan complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path . \
            --log-opts="--all" \
            --redact=100 \
            --no-banner

  installer-macos-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify macOS system Bash installer path
        run: |
          /bin/bash --version | head -1
          python -m pytest -q tests/test_install_safety.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Docker integration smoke tests
        env:
          CAGE_RUN_DOCKER_SMOKE: '1'
        run: python -m pytest -q tests/test_docker_smoke.py

      - name: Build shared base, Desktop Codex, OpenCode, and Token Monitor smoke images
        run: |
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_VERSION=ci -t cage-base:ci -f Dockerfile.base .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t codex:desktop-smoke -f Dockerfile.codex .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t opencode:smoke -f Dockerfile.opencode .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t cage-token-monitor:smoke -f Dockerfile.monitor .
          docker run --rm --entrypoint opencode opencode:smoke --version
          CAGE_RUN_OPENCODE_DOCKER_CONTRACT=1 python3 -m pytest -q tests/test_opencode_proxy_contract.py

      - name: Run Desktop SSH integration smoke test
        env:
          CAGE_RUN_DOCKER_SMOKE: '1'
          CAGE_DESKTOP_SMOKE_IMAGE: codex:desktop-smoke
        run: python -m pytest -q tests/test_docker_smoke.py -k desktop_remote

      - name: Check Python syntax
        run: python -m compileall -q cage-main.py cage-config.py cage_core cage-desktop.py cage-tui.py codex-remote.py cage-user-remap.py netgate-proxy.py mcp-bridge.py mcp-relay host-cmd-bridge.py host-cmd-relay scripts/build-release.py

      - name: Check shell syntax
        run: |
          bash -n cage cage-netgate.sh entrypoint.sh entrypoint-codex.sh entrypoint-opencode.sh install.sh .github/scripts/install-gitleaks.sh
          node --check token-monitor-collector.js

      - name: Validate Compose configuration
        run: docker compose config

  # Publish immutable SHA-only candidate images after every CI gate passes on a
  # push to main. These are write-once, content-addressed, and never referenced
  # by Cage's pull logic; the tag-triggered release workflow promotes the exact
  # digests instead of rebuilding. No cross-version BuildKit cache is used.
  candidate-base:
    needs: [secret-scan, installer-macos-bash32, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: candidate-base-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      base_digest: ${{ steps.digests.outputs.base }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version and commit
        id: meta
        run: |
          VERSION="$(grep '^CAGE_VERSION=' cage | cut -d'"' -f2)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve existing candidates (verify and reuse) or fail closed
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          repo_path="sindycate/cage/base"
          ref="ghcr.io/sindycate/cage/base:candidate-${SHA}"
          status="$(ghcr_status "$repo_path" "candidate-${SHA}")"
          case "$status" in
            200)
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
              arches="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}')"
              case "$arches" in
                *amd64*arm64*) ;;
                *) echo "ERROR: existing candidate base missing amd64/arm64 (${arches})"; exit 1 ;;
              esac
              gh attestation verify "oci://ghcr.io/sindycate/cage/base@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
                --source-digest "${SHA}" \
                --source-ref refs/heads/main
              echo "Reusing verified existing candidate base@${digest}"
              echo "base_exists=true" >> "$GITHUB_OUTPUT"
              echo "base_digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "No existing candidate for base; it will be built."
              echo "base_exists=false" >> "$GITHUB_OUTPUT"
              echo "base_digest=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: ambiguous registry status (${status}) for ${ref}; refusing to build to protect write-once candidate tags." >&2
              exit 1
              ;;
          esac

      - name: Build and push candidate base image
        id: base
        if: steps.resolve.outputs.base_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            CAGE_VERSION=${{ env.VERSION }}
          tags: ghcr.io/sindycate/cage/base:candidate-${{ env.SHA }}

      - name: Attest candidate base image provenance
        if: steps.resolve.outputs.base_exists != 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/base
          subject-digest: ${{ steps.base.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Resolve effective candidate digests
        id: digests
        env:
          BASE_EXISTING: ${{ steps.resolve.outputs.base_digest }}
          BASE_BUILT: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          pick() { if [ -n "$1" ]; then printf '%s' "$1"; else printf '%s' "$2"; fi; }
          BASE="$(pick "$BASE_EXISTING" "$BASE_BUILT")"
          case "$BASE" in
            sha256:*) ;;
            *) echo "ERROR: invalid candidate digest: ${BASE}"; exit 1 ;;
          esac
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

  candidate-leaf:
    needs: [candidate-base]
    runs-on: ubuntu-latest
    concurrency:
      group: candidate-leaf-${{ matrix.image }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claude-code
            dockerfile: Dockerfile
          - image: codex
            dockerfile: Dockerfile.codex
          - image: opencode
            dockerfile: Dockerfile.opencode
          - image: token-monitor
            dockerfile: Dockerfile.monitor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set environment
        run: |
          echo "VERSION=${{ needs.candidate-base.outputs.version }}" >> "$GITHUB_ENV"
          echo "SHA=${{ needs.candidate-base.outputs.sha }}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve existing candidate or fail closed
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          repo_path="sindycate/cage/${{ matrix.image }}"
          ref="ghcr.io/sindycate/cage/${{ matrix.image }}:candidate-${SHA}"
          status="$(ghcr_status "$repo_path" "candidate-${SHA}")"
          case "$status" in
            200)
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
              arches="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}')"
              case "$arches" in
                *amd64*arm64*) ;;
                *) echo "ERROR: existing candidate ${{ matrix.image }} missing amd64/arm64 (${arches})"; exit 1 ;;
              esac
              gh attestation verify "oci://ghcr.io/sindycate/cage/${{ matrix.image }}@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
                --source-digest "${SHA}" \
                --source-ref refs/heads/main
              echo "Reusing verified existing candidate ${{ matrix.image }}@${digest}"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "No existing candidate for ${{ matrix.image }}; it will be built."
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "digest=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: ambiguous registry status (${status}) for ${ref}; refusing to build to protect write-once candidate tags." >&2
              exit 1
              ;;
          esac

      - name: Build and push candidate image from exact base digest
        id: build
        if: steps.resolve.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            CAGE_BASE=ghcr.io/sindycate/cage/base@${{ needs.candidate-base.outputs.base_digest }}
            CAGE_VERSION=${{ env.VERSION }}
          tags: ghcr.io/sindycate/cage/${{ matrix.image }}:candidate-${{ env.SHA }}

      - name: Attest candidate image provenance
        if: steps.resolve.outputs.exists != 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Resolve effective digest
        id: digests
        env:
          EXISTING: ${{ steps.resolve.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          pick() { if [ -n "$1" ]; then printf '%s' "$1"; else printf '%s' "$2"; fi; }
          EFFECTIVE="$(pick "$EXISTING" "$BUILT")"
          case "$EFFECTIVE" in
            sha256:*) ;;
            *) echo "ERROR: invalid candidate digest: ${EFFECTIVE}"; exit 1 ;;
          esac
          mkdir -p leaf-digests
          echo "$EFFECTIVE" > "leaf-digests/${{ matrix.image }}.digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-digest-${{ matrix.image }}-${{ github.sha }}
          path: leaf-digests/${{ matrix.image }}.digest
          retention-days: 1

  candidate:
    needs: [candidate-base, candidate-leaf]
    runs-on: ubuntu-latest
    concurrency:
      group: candidate-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-digest-*-${{ github.sha }}
          path: leaf-digests
          merge-multiple: true

      - name: Write candidate manifest
        env:
          BASE_DIGEST: ${{ needs.candidate-base.outputs.base_digest }}
          SHA: ${{ needs.candidate-base.outputs.sha }}
          VERSION: ${{ needs.candidate-base.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, re

          sha = os.environ["SHA"]
          version = os.environ["VERSION"]
          run_id = int(os.environ["RUN_ID"])
          base_digest = os.environ["BASE_DIGEST"].strip()

          leaf_names = ("claude-code", "codex", "opencode", "token-monitor")
          digests = {"base": base_digest}
          for name in leaf_names:
              path = os.path.join("leaf-digests", f"{name}.digest")
              if not os.path.isfile(path):
                  sys.exit(f"Missing digest file for {name}: {path}")
              with open(path, encoding="utf-8") as f:
                  digests[name] = f.read().strip()

          for name, digest in digests.items():
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  sys.exit(f"Invalid candidate digest for {name}: {digest}")

          manifest = {
              "schema": "cage.release-candidate",
              "schema_version": 3,
              "source_sha": sha,
              "version": version,
              "ci_run_id": run_id,
              "platforms": ["linux/amd64", "linux/arm64"],
              "images": {
                  name: {
                      "name": f"ghcr.io/sindycate/cage/{name}",
                      "tag": f"candidate-{sha}",
                      "digest": digests[name]
                  }
                  for name in ("base", "claude-code", "codex", "opencode", "token-monitor")
              }
          }

          manifest_path = f"release-candidate-{sha}.json"
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          # Verify parsing
          with open(manifest_path, encoding="utf-8") as f:
              json.load(f)
          print(f"Wrote verified manifest to {manifest_path}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.candidate-base.outputs.sha }}
          path: release-candidate-${{ needs.candidate-base.outputs.sha }}.json
          if-no-files-found: error
          retention-days: 30
