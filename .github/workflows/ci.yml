name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        run: .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"

      - name: Scan complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path . \
            --log-opts="--all" \
            --redact=100 \
            --no-banner

  installer-macos-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify macOS system Bash installer path
        run: |
          /bin/bash --version | head -1
          python -m pytest -q tests/test_install_safety.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Docker integration smoke tests
        env:
          CAGE_RUN_DOCKER_SMOKE: '1'
        run: python -m pytest -q tests/test_docker_smoke.py

      - name: Build shared base, Desktop Codex, OpenCode, and Token Monitor smoke images
        run: |
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_VERSION=ci -t cage-base:ci -f Dockerfile.base .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t codex:desktop-smoke -f Dockerfile.codex .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t opencode:smoke -f Dockerfile.opencode .
          docker build --label io.cage.lifecycle=ephemeral --build-arg CAGE_BASE=cage-base:ci --build-arg CAGE_VERSION=ci -t cage-token-monitor:smoke -f Dockerfile.monitor .
          docker run --rm --entrypoint opencode opencode:smoke --version
          CAGE_RUN_OPENCODE_DOCKER_CONTRACT=1 python3 -m pytest -q tests/test_opencode_proxy_contract.py

      - name: Run Desktop SSH integration smoke test
        env:
          CAGE_RUN_DOCKER_SMOKE: '1'
          CAGE_DESKTOP_SMOKE_IMAGE: codex:desktop-smoke
        run: python -m pytest -q tests/test_docker_smoke.py -k desktop_remote

      - name: Check Python syntax
        run: python -m compileall -q cage-main.py cage-config.py cage_core cage-desktop.py cage-tui.py codex-remote.py cage-user-remap.py netgate-proxy.py mcp-bridge.py mcp-relay host-cmd-bridge.py host-cmd-relay scripts/build-release.py

      - name: Check shell syntax
        run: |
          bash -n cage cage-netgate.sh entrypoint.sh entrypoint-codex.sh entrypoint-opencode.sh install.sh .github/scripts/install-gitleaks.sh
          node --check token-monitor-collector.js

      - name: Validate Compose configuration
        run: docker compose config

  # Publish immutable SHA-only candidate images after every CI gate passes on a
  # push to main. These are write-once, content-addressed, and never referenced
  # by Cage's pull logic; the tag-triggered release workflow promotes the exact
  # digests instead of rebuilding. No cross-version BuildKit cache is used.
  candidate:
    needs: [secret-scan, installer-macos-bash32, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: candidate-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version and commit
        run: |
          echo "VERSION=$(grep '^CAGE_VERSION=' cage | cut -d'"' -f2)" >> "$GITHUB_ENV"
          echo "SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Candidate tags are write-once. Before building anything, resolve each
      # candidate: if the tag already exists, verify its platforms and CI
      # attestation for this exact SHA and reuse its digest; if it exists but
      # cannot be verified, fail closed (never overwrite). Missing candidates are
      # built below; build/attest steps are skipped for reused images so a CI
      # rerun can never replace an immutable candidate with freshly resolved
      # mutable dependencies.
      - name: Resolve existing candidates (verify and reuse) or fail closed
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          for image in base claude-code codex opencode token-monitor; do
            case "$image" in
              base) key=base ;;
              claude-code) key=claude ;;
              codex) key=codex ;;
              opencode) key=opencode ;;
              token-monitor) key=monitor ;;
            esac
            repo_path="sindycate/cage/${image}"
            ref="ghcr.io/sindycate/cage/${image}:candidate-${SHA}"
            # Authoritative existence check: branch on the registry HTTP status
            # code, never on free-form error text (which a commit SHA containing
            # "404" or a credential-helper/network message containing "not found"
            # could spoof).
            status="$(ghcr_status "$repo_path" "candidate-${SHA}")"
            case "$status" in
              200)
                # Candidate exists: verify platforms + CI attestation, then reuse.
                digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
                arches="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}')"
                case "$arches" in
                  *amd64*arm64*) ;;
                  *) echo "ERROR: existing candidate ${image} missing amd64/arm64 (${arches})"; exit 1 ;;
                esac
                gh attestation verify "oci://ghcr.io/sindycate/cage/${image}@${digest}" \
                  --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
                  --source-digest "${SHA}" \
                  --source-ref refs/heads/main
                echo "Reusing verified existing candidate ${image}@${digest}"
                echo "${key}_exists=true" >> "$GITHUB_OUTPUT"
                echo "${key}_digest=${digest}" >> "$GITHUB_OUTPUT"
                ;;
              404)
                # Authoritative absence: the only result that authorizes creation.
                echo "No existing candidate for ${image}; it will be built."
                echo "${key}_exists=false" >> "$GITHUB_OUTPUT"
                echo "${key}_digest=" >> "$GITHUB_OUTPUT"
                ;;
              *)
                # Ambiguous (auth 401/403, rate limit, timeout, network, registry
                # 5xx, unreachable): fail closed so a CI rerun can never overwrite
                # an immutable candidate tag whose existence was not confirmed.
                echo "ERROR: ambiguous registry status (${status}) for ${ref}; refusing to build to protect write-once candidate tags." >&2
                exit 1
                ;;
            esac
          done

      - name: Build and push candidate base image
        id: base
        if: steps.resolve.outputs.base_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            CAGE_VERSION=${{ env.VERSION }}
          tags: ghcr.io/sindycate/cage/base:candidate-${{ env.SHA }}

      - name: Attest candidate base image provenance
        if: steps.resolve.outputs.base_exists != 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/base
          subject-digest: ${{ steps.base.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Resolve effective base digest
        id: basedigest
        env:
          EXISTING_BASE: ${{ steps.resolve.outputs.base_digest }}
          BUILT_BASE: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_BASE" ]; then
            echo "digest=$EXISTING_BASE" >> "$GITHUB_OUTPUT"
          else
            [ -n "$BUILT_BASE" ] || { echo "ERROR: no base digest available"; exit 1; }
            echo "digest=$BUILT_BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push candidate claude-code image from exact base digest
        id: claude
        if: steps.resolve.outputs.claude_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            CAGE_BASE=ghcr.io/sindycate/cage/base@${{ steps.basedigest.outputs.digest }}
            CAGE_VERSION=${{ env.VERSION }}
          tags: ghcr.io/sindycate/cage/claude-code:candidate-${{ env.SHA }}

      - name: Attest candidate claude-code image provenance
        if: steps.resolve.outputs.claude_exists != 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/claude-code
          subject-digest: ${{ steps.claude.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build and push candidate codex image from exact base digest
        id: codex
        if: steps.resolve.outputs.codex_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.codex
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            CAGE_BASE=ghcr.io/sindycate/cage/base@${{ steps.basedigest.outputs.digest }}
            CAGE_VERSION=${{ env.VERSION }}
          tags: ghcr.io/sindycate/cage/codex:candidate-${{ env.SHA }}

      - name: Attest candidate codex image provenance
        if: steps.resolve.outputs.codex_exists != 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/codex
          subject-digest: ${{ steps.codex.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build and push candidate opencode image from exact base digest
        id: opencode
        if: steps.resolve.outputs.opencode_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.opencode
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            CAGE_BASE=ghcr.io/sindycate/cage/base@${{ steps.basedigest.outputs.digest }}
            CAGE_VERSION=${{ env.VERSION }}
          tags: ghcr.io/sindycate/cage/opencode:candidate-${{ env.SHA }}

      - name: Attest candidate opencode image provenance
        if: steps.resolve.outputs.opencode_exists != 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/opencode
          subject-digest: ${{ steps.opencode.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build and push candidate Token Monitor image from exact base digest
        id: monitor
        if: steps.resolve.outputs.monitor_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.monitor
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            CAGE_BASE=ghcr.io/sindycate/cage/base@${{ steps.basedigest.outputs.digest }}
            CAGE_VERSION=${{ env.VERSION }}
          tags: ghcr.io/sindycate/cage/token-monitor:candidate-${{ env.SHA }}

      - name: Attest candidate Token Monitor image provenance
        if: steps.resolve.outputs.monitor_exists != 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/token-monitor
          subject-digest: ${{ steps.monitor.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Resolve effective candidate digests
        id: digests
        env:
          BASE_EXISTING: ${{ steps.resolve.outputs.base_digest }}
          BASE_BUILT: ${{ steps.base.outputs.digest }}
          CLAUDE_EXISTING: ${{ steps.resolve.outputs.claude_digest }}
          CLAUDE_BUILT: ${{ steps.claude.outputs.digest }}
          CODEX_EXISTING: ${{ steps.resolve.outputs.codex_digest }}
          CODEX_BUILT: ${{ steps.codex.outputs.digest }}
          OPENCODE_EXISTING: ${{ steps.resolve.outputs.opencode_digest }}
          OPENCODE_BUILT: ${{ steps.opencode.outputs.digest }}
          MONITOR_EXISTING: ${{ steps.resolve.outputs.monitor_digest }}
          MONITOR_BUILT: ${{ steps.monitor.outputs.digest }}
        run: |
          set -euo pipefail
          pick() { if [ -n "$1" ]; then printf '%s' "$1"; else printf '%s' "$2"; fi; }
          BASE="$(pick "$BASE_EXISTING" "$BASE_BUILT")"
          CLAUDE="$(pick "$CLAUDE_EXISTING" "$CLAUDE_BUILT")"
          CODEX="$(pick "$CODEX_EXISTING" "$CODEX_BUILT")"
          OPENCODE="$(pick "$OPENCODE_EXISTING" "$OPENCODE_BUILT")"
          MONITOR="$(pick "$MONITOR_EXISTING" "$MONITOR_BUILT")"
          for value in "$BASE" "$CLAUDE" "$CODEX" "$OPENCODE" "$MONITOR"; do
            case "$value" in
              sha256:*) ;;
              *) echo "ERROR: invalid candidate digest: ${value}"; exit 1 ;;
            esac
          done
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "claude=$CLAUDE" >> "$GITHUB_OUTPUT"
          echo "codex=$CODEX" >> "$GITHUB_OUTPUT"
          echo "opencode=$OPENCODE" >> "$GITHUB_OUTPUT"
          echo "monitor=$MONITOR" >> "$GITHUB_OUTPUT"

      - name: Write candidate manifest
        env:
          BASE_DIGEST: ${{ steps.digests.outputs.base }}
          CLAUDE_DIGEST: ${{ steps.digests.outputs.claude }}
          CODEX_DIGEST: ${{ steps.digests.outputs.codex }}
          OPENCODE_DIGEST: ${{ steps.digests.outputs.opencode }}
          MONITOR_DIGEST: ${{ steps.digests.outputs.monitor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > "release-candidate-${SHA}.json" <<EOF
          {
            "schema": "cage.release-candidate",
            "schema_version": 3,
            "source_sha": "${SHA}",
            "version": "${VERSION}",
            "ci_run_id": ${RUN_ID},
            "platforms": ["linux/amd64", "linux/arm64"],
            "images": {
              "base": {"name": "ghcr.io/sindycate/cage/base", "tag": "candidate-${SHA}", "digest": "${BASE_DIGEST}"},
              "claude-code": {"name": "ghcr.io/sindycate/cage/claude-code", "tag": "candidate-${SHA}", "digest": "${CLAUDE_DIGEST}"},
              "codex": {"name": "ghcr.io/sindycate/cage/codex", "tag": "candidate-${SHA}", "digest": "${CODEX_DIGEST}"},
              "opencode": {"name": "ghcr.io/sindycate/cage/opencode", "tag": "candidate-${SHA}", "digest": "${OPENCODE_DIGEST}"},
              "token-monitor": {"name": "ghcr.io/sindycate/cage/token-monitor", "tag": "candidate-${SHA}", "digest": "${MONITOR_DIGEST}"}
            }
          }
          EOF
          python3 -c 'import json, sys; json.load(open(sys.argv[1]))' "release-candidate-${SHA}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ env.SHA }}
          path: release-candidate-${{ env.SHA }}.json
          if-no-files-found: error
          retention-days: 30
