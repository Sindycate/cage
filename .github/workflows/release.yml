name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Release publication is serialized per tag and never cancelled mid-flight, so a
# rerun can resume after a partial GitHub or registry interruption.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: exact-commit gate.
  #
  # Protects manual tag pushes too. Requires an annotated tag whose commit has a
  # successful ci.yml push run on main, then verifies the exact-SHA candidate
  # images, their digests, platforms, and CI attestations before any release
  # work happens. Fails closed if a version tag already exists with a different
  # digest.
  # --------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base_digest: ${{ steps.candidates.outputs.base_digest }}
      claude_digest: ${{ steps.candidates.outputs.claude_digest }}
      codex_digest: ${{ steps.candidates.outputs.codex_digest }}
      opencode_digest: ${{ steps.candidates.outputs.opencode_digest }}
      monitor_digest: ${{ steps.candidates.outputs.monitor_digest }}
      ci_run_id: ${{ steps.ci-run.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag, version, and commit agree
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            v*) ;;
            *) echo "ERROR: ref is not a version tag: $TAG"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          SCRIPT_VER="$(grep '^CAGE_VERSION=' cage | cut -d'"' -f2)"
          if [ "$VERSION" != "$SCRIPT_VER" ]; then
            echo "ERROR: tag v${VERSION} does not match CAGE_VERSION=${SCRIPT_VER}"; exit 1
          fi
          # actions/checkout may materialize the triggering tag as a lightweight
          # local ref even when the remote tag is annotated. Verify the remote
          # direct + peeled refs instead of trusting the checkout's local ref.
          REMOTE_TAGS="$(git ls-remote --tags origin \
            "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          TAG_OBJECT="$(printf '%s\n' "$REMOTE_TAGS" | \
            awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1; exit }')"
          TAG_COMMIT="$(printf '%s\n' "$REMOTE_TAGS" | \
            awk -v ref="refs/tags/${TAG}^{}" '$2 == ref { print $1; exit }')"
          if [ -z "$TAG_OBJECT" ] || [ -z "$TAG_COMMIT" ]; then
            echo "ERROR: ${TAG} must be an annotated tag"; exit 1
          fi
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "ERROR: ${TAG} does not dereference to $GITHUB_SHA"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Locate exact successful CI run and download candidate manifest
        id: ci-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --branch main --json databaseId,headSha,conclusion --limit 50 \
            --jq ".[] | select(.headSha==\"${GITHUB_SHA}\") | select(.conclusion==\"success\") | .databaseId" \
            | head -1)"
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: no successful ci.yml push run for ${GITHUB_SHA} on main"; exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-${GITHUB_SHA}" --dir candidate-manifest
          test -f "candidate-manifest/release-candidate-${GITHUB_SHA}.json"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate digests, platforms, attestations, and version-tag absence
        id: candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          CI_RUN_ID: ${{ steps.ci-run.outputs.run_id }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          MANIFEST="candidate-manifest/release-candidate-${GITHUB_SHA}.json"
          python3 - "$MANIFEST" "$GITHUB_SHA" "$VERSION" "$CI_RUN_ID" <<'PY'
          import json, re, sys
          path, sha, version, run_id = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest.get("schema") != "cage.release-candidate" or manifest.get("schema_version") != 3:
              raise SystemExit("ERROR: candidate manifest must use cage.release-candidate schema version 3")
          if manifest.get("source_sha") != sha or manifest.get("version") != version:
              raise SystemExit("ERROR: candidate manifest source identity mismatch")
          if manifest.get("ci_run_id") != int(run_id):
              raise SystemExit("ERROR: candidate manifest CI run mismatch")
          if manifest.get("platforms") != ["linux/amd64", "linux/arm64"]:
              raise SystemExit("ERROR: candidate manifest platform set mismatch")
          names = ("base", "claude-code", "codex", "opencode", "token-monitor")
          images = manifest.get("images")
          if not isinstance(images, dict) or set(images) != set(names):
              raise SystemExit("ERROR: candidate manifest must contain exactly base, claude-code, codex, opencode, and token-monitor")
          for name in names:
              entry = images[name]
              if entry.get("name") != "ghcr.io/sindycate/cage/" + name:
                  raise SystemExit("ERROR: candidate manifest image name mismatch for " + name)
              if entry.get("tag") != "candidate-" + sha:
                  raise SystemExit("ERROR: candidate manifest tag mismatch for " + name)
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", entry.get("digest", "")):
                  raise SystemExit("ERROR: candidate manifest digest mismatch for " + name)
          PY
          verify_exact_platforms() {
            local ref="$1"
            local label="$2"
            local platforms actual
            platforms="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            actual="$(printf '%s' "$platforms" | tr ' ' '\n' | sed '/^$/d' | awk '$0 != "unknown/unknown"' | LC_ALL=C sort -u)"
            if [ "$actual" != $'linux/amd64\nlinux/arm64' ]; then
              echo "ERROR: ${label} must contain exactly linux/amd64 and linux/arm64 (${platforms})" >&2
              exit 1
            fi
          }
          for image in base claude-code codex opencode token-monitor; do
            case "$image" in
              base) key=base ;;
              claude-code) key=claude ;;
              codex) key=codex ;;
              opencode) key=opencode ;;
              token-monitor) key=monitor ;;
            esac
            expected="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["images"][sys.argv[2]]["digest"])' "$MANIFEST" "$image")"
            candidate="ghcr.io/sindycate/cage/${image}:candidate-${GITHUB_SHA}"
            actual="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: candidate ${image} digest ${actual} != manifest ${expected}"; exit 1
            fi
            verify_exact_platforms "$candidate" "candidate ${image}"
            gh attestation verify "oci://ghcr.io/sindycate/cage/${image}@${expected}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main
            versioned="ghcr.io/sindycate/cage/${image}:${VERSION}"
            versioned_status="$(ghcr_status "sindycate/cage/${image}" "${VERSION}")"
            case "$versioned_status" in
              200)
                existing="$(docker buildx imagetools inspect "$versioned" --format '{{.Manifest.Digest}}')"
                if [ "$existing" != "$expected" ]; then
                  echo "ERROR: version tag ${versioned} exists with digest ${existing} != ${expected}"; exit 1
                fi
                ;;
              404)
                ;;  # absent: promotion will create it
              *)
                echo "ERROR: ambiguous registry status (${versioned_status}) for ${versioned}; refusing to proceed" >&2
                exit 1
                ;;
            esac
            echo "${key}_digest=$expected" >> "$GITHUB_OUTPUT"
          done

  # --------------------------------------------------------------------------
  # Stage 2: source package.
  #
  # The exact successful CI run replaces the duplicated Python/macOS/Docker/
  # history-scan jobs. The archive-content secret scan stays because it
  # validates the generated deliverable rather than repository source.
  # --------------------------------------------------------------------------
  package:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Derive version and source timestamp
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          SCRIPT_VER="$(grep '^CAGE_VERSION=' cage | cut -d'"' -f2)"
          if [ "$TAG" != "$SCRIPT_VER" ]; then
            echo "ERROR: Tag v${TAG} does not match CAGE_VERSION=\"${SCRIPT_VER}\" in cage script"
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Create reproducible source archive
        run: python scripts/build-release.py "$VERSION"

      - name: Install checksum-verified Gitleaks
        run: .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"

      - name: Scan source archive contents
        run: |
          mkdir "$RUNNER_TEMP/release-scan"
          tar -xzf "cage-${VERSION}.tar.gz" -C "$RUNNER_TEMP/release-scan"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$RUNNER_TEMP/release-scan" \
            --config .gitleaks.toml \
            --gitleaks-ignore-path . \
            --redact=100 \
            --no-banner

      - name: Generate source archive SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: cage-${{ env.VERSION }}.tar.gz
          format: spdx-json
          output-file: cage-${{ env.VERSION }}.spdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest source archive provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: cage-${{ env.VERSION }}.tar.gz

      - name: Attest source archive SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: cage-${{ env.VERSION }}.tar.gz
          sbom-path: cage-${{ env.VERSION }}.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cage-release-${{ github.ref_name }}
          path: |
            cage-${{ env.VERSION }}.tar.gz
            cage-${{ env.VERSION }}.tar.gz.sha256
            cage-${{ env.VERSION }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # Stage 3a: image promotion (immutable version tags from exact digests).
  #
  # Promotes the verified candidate digests to version tags and re-attests them
  # from this release workflow. Never rebuilds, never uses QEMU, never resolves
  # mutable package sources. Idempotent: an existing version tag with the same
  # digest is resumable success; a different digest fails closed.
  # --------------------------------------------------------------------------
  promote:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: base
            digest: ${{ needs.gate.outputs.base_digest }}
          - image: claude-code
            digest: ${{ needs.gate.outputs.claude_digest }}
          - image: codex
            digest: ${{ needs.gate.outputs.codex_digest }}
          - image: opencode
            digest: ${{ needs.gate.outputs.opencode_digest }}
          - image: token-monitor
            digest: ${{ needs.gate.outputs.monitor_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable version tag from exact candidate digest
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          DIGEST: ${{ matrix.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . .github/scripts/ghcr-status.sh
          repo="ghcr.io/sindycate/cage/${{ matrix.image }}"
          repo_path="sindycate/cage/${{ matrix.image }}"
          # Authoritative existence check on the registry status code. Only an
          # authoritative 404 authorizes creating the immutable version tag; a
          # matching digest is resumable success; a conflicting digest or any
          # ambiguous failure (401/403, timeout, 5xx) fails closed so a registry
          # outage can never attempt to replace an existing immutable version tag.
          versioned_status="$(ghcr_status "$repo_path" "${VERSION}")"
          case "$versioned_status" in
            200)
              existing="$(docker buildx imagetools inspect "${repo}:${VERSION}" --format '{{.Manifest.Digest}}')"
              if [ "$existing" != "$DIGEST" ]; then
                echo "ERROR: version tag ${repo}:${VERSION} exists with digest ${existing} != ${DIGEST}" >&2; exit 1
              fi
              echo "version tag ${repo}:${VERSION} already points to ${DIGEST}"
              ;;
            404)
              docker buildx imagetools create -t "${repo}:${VERSION}" "${repo}@${DIGEST}"
              ;;
            *)
              echo "ERROR: ambiguous registry status (${versioned_status}) for ${repo}:${VERSION}; refusing to create/overwrite immutable version tag" >&2
              exit 1
              ;;
          esac

      - name: Re-attest promoted digest from release workflow
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/sindycate/cage/${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
          create-storage-record: false

  # --------------------------------------------------------------------------
  # Stage 3b: move latest only after ALL version tags and attestations succeed.
  # --------------------------------------------------------------------------
  latest:
    needs: [gate, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: base
            digest: ${{ needs.gate.outputs.base_digest }}
          - image: claude-code
            digest: ${{ needs.gate.outputs.claude_digest }}
          - image: codex
            digest: ${{ needs.gate.outputs.codex_digest }}
          - image: opencode
            digest: ${{ needs.gate.outputs.opencode_digest }}
          - image: token-monitor
            digest: ${{ needs.gate.outputs.monitor_digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to the promoted digest
        env:
          DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          repo="ghcr.io/sindycate/cage/${{ matrix.image }}"
          docker buildx imagetools create -t "${repo}:latest" "${repo}@${DIGEST}"

  # --------------------------------------------------------------------------
  # Stage 4: public consumer gate.
  #
  # GHCR publication and package visibility are separate. Run after every image
  # is promoted, but before the GitHub Release is created, under a brand-new
  # empty Docker credential directory so maintainer credentials cannot hide a
  # private or inaccessible package.
  # --------------------------------------------------------------------------
  public-images:
    needs: [gate, promote, latest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: base
            digest: ${{ needs.gate.outputs.base_digest }}
          - image: claude-code
            digest: ${{ needs.gate.outputs.claude_digest }}
          - image: codex
            digest: ${{ needs.gate.outputs.codex_digest }}
          - image: opencode
            digest: ${{ needs.gate.outputs.opencode_digest }}
          - image: token-monitor
            digest: ${{ needs.gate.outputs.monitor_digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify anonymous version and latest manifests and pulls
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          EXPECTED_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          credential_dir="$(mktemp -d "$RUNNER_TEMP/cage-anonymous-docker.XXXXXX")"
          trap 'rm -rf "$credential_dir"' EXIT
          if find "$credential_dir" -mindepth 1 -print -quit | grep -q .; then
            echo "ERROR: anonymous Docker credential directory is not empty" >&2
            exit 1
          fi
          verify_exact_platforms() {
            local ref="$1"
            local label="$2"
            local platforms actual
            platforms="$(env \
              -u GH_TOKEN -u GITHUB_TOKEN \
              -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
              -u DOCKER_AUTH_CONFIG -u REGISTRY_AUTH_FILE \
              DOCKER_CONFIG="$credential_dir" \
              docker buildx imagetools inspect "$ref" \
                --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            actual="$(printf '%s' "$platforms" | tr ' ' '\n' | sed '/^$/d' | awk '$0 != "unknown/unknown"' | LC_ALL=C sort -u)"
            if [ "$actual" != $'linux/amd64\nlinux/arm64' ]; then
              echo "ERROR: ${label} must contain exactly linux/amd64 and linux/arm64 (${platforms})" >&2
              exit 1
            fi
          }
          for tag in "$VERSION" latest; do
            ref="ghcr.io/sindycate/cage/${{ matrix.image }}:${tag}"
            actual_digest="$(env \
              -u GH_TOKEN -u GITHUB_TOKEN \
              -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
              -u DOCKER_AUTH_CONFIG -u REGISTRY_AUTH_FILE \
              DOCKER_CONFIG="$credential_dir" \
              docker buildx imagetools inspect "$ref" \
                --format '{{.Manifest.Digest}}')"
            if [ "$actual_digest" != "$EXPECTED_DIGEST" ]; then
              echo "ERROR: public ${ref} digest ${actual_digest} != ${EXPECTED_DIGEST}" >&2
              exit 1
            fi
            verify_exact_platforms "$ref" "public ${ref}"
            env \
              -u GH_TOKEN -u GITHUB_TOKEN \
              -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
              -u DOCKER_AUTH_CONFIG -u REGISTRY_AUTH_FILE \
              DOCKER_CONFIG="$credential_dir" \
              docker pull --platform linux/amd64 "$ref"
          done

  # --------------------------------------------------------------------------
  # Stage 5: GitHub Release, created last.
  # --------------------------------------------------------------------------
  release:
    needs: [package, promote, latest, public-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cage-release-${{ github.ref_name }}
          path: dist

      - name: Verify downloaded release payload
        working-directory: dist
        run: |
          sha256sum --check "cage-${GITHUB_REF_NAME#v}.tar.gz.sha256"
          test -s "cage-${GITHUB_REF_NAME#v}.spdx.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          DIST="cage-${VERSION}"
          ASSETS=("${DIST}.tar.gz" "${DIST}.tar.gz.sha256" "${DIST}.spdx.json")
          # Idempotent: if a previous run created the release but then reported
          # failure, a rerun verifies the existing release — metadata AND asset
          # contents — and treats an exact match as resumed success instead of
          # failing on "release already exists". Any difference (metadata, asset
          # set, size, or SHA-256) fails closed; never silently overwritten.
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            is_draft="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            is_pre="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            tag_name="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
            if [ "$is_draft" != "false" ] || [ "$is_pre" != "false" ] || [ "$tag_name" != "v${VERSION}" ]; then
              echo "ERROR: existing release v${VERSION} has unexpected metadata (draft=${is_draft} prerelease=${is_pre} tag=${tag_name}); refusing." >&2
              exit 1
            fi
            existing="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort)"
            expected="$(printf '%s\n' "${ASSETS[@]}" | sort)"
            if [ "$existing" != "$expected" ]; then
              echo "ERROR: release v${VERSION} exists but its asset set differs; refusing to overwrite." >&2
              echo "existing assets:" >&2; printf '%s\n' "$existing" >&2
              echo "expected assets:" >&2; printf '%s\n' "$expected" >&2
              exit 1
            fi
            # Compare each existing asset's content (size + SHA-256) against the
            # freshly generated artifact, not just its name. Empty, truncated, or
            # different files under the right names are rejected.
            verify_dir="$(mktemp -d)"
            for asset in "${ASSETS[@]}"; do
              gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --dir "$verify_dir" --clobber
              if [ ! -s "${verify_dir}/${asset}" ]; then
                echo "ERROR: existing release asset ${asset} is missing or empty; refusing to treat as recovered." >&2
                exit 1
              fi
              existing_sum="$(sha256sum "${verify_dir}/${asset}" | awk '{print $1}')"
              local_sum="$(sha256sum "dist/${asset}" | awk '{print $1}')"
              existing_size="$(wc -c < "${verify_dir}/${asset}" | tr -d ' ')"
              local_size="$(wc -c < "dist/${asset}" | tr -d ' ')"
              if [ "$existing_sum" != "$local_sum" ] || [ "$existing_size" != "$local_size" ]; then
                echo "ERROR: existing release asset ${asset} differs from the generated artifact (sha256/size mismatch); refusing to overwrite." >&2
                exit 1
              fi
            done
            rm -rf "$verify_dir"
            echo "Release v${VERSION} already exists with identical metadata and assets; resuming."
            exit 0
          fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "cage ${VERSION}" \
            --generate-notes \
            "dist/${DIST}.tar.gz" \
            "dist/${DIST}.tar.gz.sha256" \
            "dist/${DIST}.spdx.json"
